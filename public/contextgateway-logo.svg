<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ContextGateway</title>
  <desc id="desc">A secure glowing gateway with a shield and G monogram.</desc>
  <defs>
    <linearGradient id="frame" x1="42" y1="24" x2="212" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23d7ff"/>
      <stop offset="0.52" stop-color="#2379f4"/>
      <stop offset="1" stop-color="#6d45ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="92" y1="78" x2="164" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64fff1"/>
      <stop offset="1" stop-color="#13bde8"/>
    </linearGradient>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientTransform="translate(128 116) rotate(90) scale(140)">
      <stop stop-color="#10263d"/>

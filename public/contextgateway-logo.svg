  <path d="M61 187V104c0-38 29-64 67-64s67 26 67 64v83" fill="none" stroke="#0c2741" stroke-width="8" opacity=".95"/>

  <g stroke="url(#cyan)" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <path d="M128 62v61"/>
    <path d="M91 84v31c0 13 6 22 19 30"/>
    <path d="M165 84v31c0 13-6 22-19 30"/>
  </g>
  <g fill="#58fff0" filter="url(#glow)">
    <circle cx="128" cy="59" r="8"/>
    <circle cx="91" cy="81" r="7"/>
    <circle cx="165" cy="81" r="7"/>
  </g>

